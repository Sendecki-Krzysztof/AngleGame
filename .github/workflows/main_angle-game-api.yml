name: Azure Function Apps CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "AngelGameBackend"

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Login via Azure CLI"
        uses: azure/login@v2
        with:
          # Use the Service Principal credentials we tried earlier
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CAE011B692F245AD89F8CD7180352500 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4FF360001B3B4B53A75C969D5A87D5EF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E59F554249CD46D7BD7D5BC2D916943F }}

      - name: "Deploy to Azure Functions"
        run: |
          # Use CLI to target the correct app based on branch
          APP_NAME=${{ (github.event_name == 'push' && github.ref_name == 'main') && 'angle-game-api' || 'angle-game-api-dev' }}

          # Force the deployment using the CLI
          az functionapp deployment source config-zip \
            -g Vektor \
            -n $APP_NAME \
            --src ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
